[workspace]
resolver = "2"
members = [
    "crates/zen-syntax",
    "crates/zen-vm",
    "crates/zen-interp",
    "crates/zen-compiler",
    "crates/zen-jit",
    "crates/zen-cli",
    "benchmarks",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/3CN-O4D/zen"
description = "Zen: a fast, stable systems and scripting language"

[workspace.dependencies]
# ── Internal ────────────────────────────────────────────────────────────────
zen-syntax = { path = "crates/zen-syntax" }
zen-vm = { path = "crates/zen-vm" }
zen-compiler = { path = "crates/zen-compiler" }
zen-jit = { path = "crates/zen-jit" }

# ── Concurrency (Milestone 10) ─────────────────────────────────────────────
rayon = "1.12"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
dashmap = "6"

# ── Networking (Milestone 10) ──────────────────────────────────────────────
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
hyper = "1"
rustls = "0.23"

# ── Util ───────────────────────────────────────────────────────────────────
indexmap = "2"
ahash = "0.8"
rustyline = "18"
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1"
phf = "0.11"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1              # keep symbols; JIT profiling needs them
panic = "unwind"       # NOT abort — see docs/01-principles.md §4
overflow-checks = true # NOT off — see docs/01-principles.md §4

# Benchmarks must be built this way or the numbers are meaningless.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
