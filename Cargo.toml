[package]
name = "zen"
version = "2.1.0"
edition = "2021"
description = "Native Rust runtime for the Zen language"
license = "MIT"

[[bin]]
name = "zen"
path = "src/main.rs"

[dependencies]
ahash = "=0.8.10"
base64 = "0.23.1"
base32 = "0.5"
rustyline = "15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
libc = "0.2"
hmac = "0.12"
md-5 = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = "0.1"
uuid = { version = "1", features = ["v1", "v3", "v4", "v5"] }
tar = "0.4"
websocket = "0.27"
x25519-dalek = { version = "2", features = ["static_secrets"] }
native-tls = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[package.metadata.deb]
maintainer = "zen-lang"
copyright = "2025 zen-lang contributors"
extended-description = "Zen is a fast, expression-oriented programming language with an ergonomic syntax, native Rust runtime, and powerful built-ins (http, crypto, socket, mqtt, hydra, wa, and more)."
section = "devel"
priority = "optional"
depends = ["libc6", "libssl3 | libssl1.1 | libssl1.0"]
recommends = ["nodejs"]
assets = [
    ["target/release/zen", "usr/bin/zen", "755"],
    ["std/*", "usr/share/zen/std/", "644"],
]
