[package]
name = "zen"
version = "0.1.0"
edition = "2021"
description = "Native Rust runtime for the Zen language"
license = "MIT"

[[bin]]
name = "zen"
path = "src/main.rs"

[dependencies]
ahash = "=0.8.10"
base64 = "0.23.1"
base32 = "0.5"
rustyline = "15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
libc = "0.2"
hmac = "0.12"
md-5 = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
pbkdf2 = "0.12"
aes = "0.8"
cbc = "0.1"
uuid = { version = "1", features = ["v1", "v3", "v4", "v5"] }
tar = "0.4"
websocket = "0.27"
