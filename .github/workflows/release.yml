name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: zen-linux-x86_64
            deb_arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: zen-linux-aarch64
            deb_arch: arm64
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            name: zen-linux-armv7
            deb_arch: armhf
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            name: zen-linux-armv6
            deb_arch: armel
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: zen-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: zen-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: zen-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build
        id: build
        continue-on-error: true
        run: cargo build --release --target ${{ matrix.target }} --package zen-cli

      - name: Package (Linux/macOS)
        if: steps.build.outcome == 'success' && runner.os != 'Windows'
        run: |
          # Bundle the binary with std/ so imports resolve from any directory.
          pkgdir="${{ matrix.name }}-pkg"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir"
          cp "target/${{ matrix.target }}/release/zen" "$pkgdir/zen"
          cp -r std "$pkgdir/std"
          cp README.md "$pkgdir/" 2>/dev/null || true
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'PREFIX="${PREFIX:-/usr/local}"' 'SRC="$(cd "$(dirname "$0")" && pwd)"' 'mkdir -p "$PREFIX/bin" "$PREFIX/share/zen"' 'cp "$SRC/zen" "$PREFIX/bin/zen"' 'chmod +x "$PREFIX/bin/zen"' 'cp -r "$SRC/std" "$PREFIX/share/zen/std"' 'echo "Installed zen to $PREFIX/bin/zen (+ stdlib). Run: zen --version"' > "$pkgdir/install.sh"
          chmod +x "$pkgdir/install.sh"
          tar czf "${{ matrix.name }}.tar.gz" -C "$pkgdir" zen std README.md install.sh
          rm -rf "$pkgdir"

      - name: Debian package (Linux)
        if: steps.build.outcome == 'success' && runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pkgdir=debroot
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir/DEBIAN" "$pkgdir/usr/bin" "$pkgdir/usr/share/zen" "$pkgdir/usr/share/doc/zen"
          cp "target/${{ matrix.target }}/release/zen" "$pkgdir/usr/bin/zen"
          chmod +x "$pkgdir/usr/bin/zen"
          cp -r std "$pkgdir/usr/share/zen/std"
          cp CHANGELOG.md "$pkgdir/usr/share/doc/zen/changelog" 2>/dev/null || true
          cp README.md "$pkgdir/usr/share/doc/zen/README" 2>/dev/null || true
          cat > "$pkgdir/DEBIAN/control" <<EOF
          Package: zen
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: 3CN-O4D <3cn-o4d@users.noreply.github.com>
          Description: Zen scripting language
           A fast, native scripting language with a Python-flavoured syntax,
           plus batteries-included modules for HTTP, files, regex, JSON,
           threading, sockets and crypto.
          EOF
          dpkg-deb --root-owner-group --build "$pkgdir" "zen_${VERSION}_${{ matrix.deb_arch }}.deb"
      - name: Package (Windows)
        if: steps.build.outcome == 'success' && runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/zen.exe" -DestinationPath "${{ matrix.name }}.zip"

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
            zen_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Zen ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Zen Language ${{ github.event.inputs.tag || github.ref_name }}

            ### Downloads
            | File | Platform |
            |------|----------|
            | `zen-linux-x86_64.tar.gz` | Linux x86_64 |
            | `zen-linux-aarch64.tar.gz` | Linux ARM64 |
            | `zen-linux-armv7.tar.gz` | Linux ARMv7 |
            | `zen-linux-armv6.tar.gz` | Linux ARMv6 |
            | `zen-macos-aarch64.tar.gz` | macOS Apple Silicon |
            | `zen-macos-x86_64.tar.gz` | macOS Intel |
            | `zen-windows-x86_64.zip` | Windows x86_64 |
            | `zen_<version>_amd64.deb` | Debian/Ubuntu x86_64 |
            | `zen_<version>_arm64.deb` | Debian/Ubuntu ARM64 |
            | `zen_<version>_armhf.deb` | Debian/Ubuntu ARMv7 |
            | `zen_<version>_armel.deb` | Debian/Ubuntu ARMv6 |

            ### Install
            ```bash
            # Debian / Ubuntu
            sudo dpkg -i zen_<version>_amd64.deb

            # Linux/macOS (tarball ships the binary + stdlib)
            tar xzf zen-linux-x86_64.tar.gz
            cd zen-linux-x86_64 && sudo ./install.sh

            # Or use the installer
            ./build.sh install
            ```
          files: artifacts/*
          draft: false
          prerelease: false
