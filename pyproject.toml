[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zen"
version = "0.1.0"
description = "Zen - Browser Automation Language. A custom DSL for modern web automation."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["web-automation", "browser", "scraping", "chromium", "dsl", "language"]
license = {text = "MIT"}
authors = [
  {name = "ecnord"},
]

dependencies = [
    "DrissionPage>=4.1.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.9",
    "lxml>=4.9",
    "psutil>=5.9",
]

[project.urls]
"Source" = "https://github.com/ecnord/zen"

[project.scripts]
zen = "zen.cli:main"

[tool.setuptools.packages.find]
include = ["zen*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
